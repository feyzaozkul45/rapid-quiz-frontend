name: CI

on:
  push:
    branches: [main]
  pull_request:

# İşler yalnızca depoyu okur; GITHUB_TOKEN'ın gereksiz yazma yetkisi olmasın.
permissions:
  contents: read

jobs:
  test:
    name: Lint, birim testleri, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
        # Playwright tarayıcıları bu işte gerekmez.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright (uçtan uca)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
